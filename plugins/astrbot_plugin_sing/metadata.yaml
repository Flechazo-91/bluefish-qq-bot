name: sing
display_name: 唱歌
short_desc: 用她自己的音色翻唱原曲 15 秒副歌
desc: >-
  「唱一首 起风了」→ 网易云搜歌取 15 秒副歌 → Demucs 分离人声/伴奏 →
  Seed-VC（F0 44k 歌声模型）把原唱人声换成她的音色 → 和原伴奏混回去 → 16k 单声道语音发回。
  旋律和伴奏都是原曲的，只有音色是她的；调性只按整八度搬（保住和声），速度（steps）40。
help: 用法：唱一首 晴天；来给我唱首稻香；来唱周杰伦的青花瓷；唱歌（口语「来/给我/帮我/快/那你」开头都认）
