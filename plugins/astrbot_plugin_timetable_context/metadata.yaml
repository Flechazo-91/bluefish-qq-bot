name: timetable_context
display_name: 今日课表上下文
short_desc: 每轮注入「今天/明天/本周概览/已录入周次」，问课表时自动展开本周+下两周逐日明细
desc: >-
  知识库里那张课表是整周的，检索容易把别的天的课当成今天的（实测周四答成周五的物理实验）。
  本插件在读 LLM 请求前直接按今天的日期算好课表和下一节，钉进上下文，不依赖检索。
help: 无需指令。问她「明天上什么课」「下周三几点」「第10周安排」即可
version: 1.2.0
author: local
astrbot_version: ">=4.17.0"
